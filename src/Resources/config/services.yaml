services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: false

    Lle\PdfGeneratorBundle\Command\CreateModelCommand:
        arguments: ["@doctrine.orm.default_entity_manager", "@Lle\\PdfGeneratorBundle\\Generator\\PdfGenerator"]

    Lle\PdfGeneratorBundle\Generator\WordToPdfGenerator:
    #    class:  'Lle\PdfGeneratorBundle\Generator\WordToPdfGenerator'
    #    arguments: [ '@property_accessor','@twig']
        tags: ['lle.pdf.generator']

    Lle\PdfGeneratorBundle\Generator\TcpdfGenerator:
        tags: ['lle.pdf.generator']

    Lle\PdfGeneratorBundle\Generator\CruditReportGenerator:
        tags: ['lle.pdf.generator']

    # data sources of the crudit_report templates (CruditDataModelInterface, registered by autoconfigure)
    Lle\PdfGeneratorBundle\DataModel\DataExtractor: ~

    Lle\PdfGeneratorBundle\DataModel\DataModelRegistry:
        arguments:
            $sources: !tagged_iterator lle.pdf.crudit_data_model
            $serializerMetadata: '@serializer.mapping.class_metadata_factory'
            $doctrine: '@?doctrine'
            $translator: '@?translator'
            $propertyInfo: '@?property_info'

    Lle\PdfGeneratorBundle\Transfer\ModelTransfer: ~

    Lle\PdfGeneratorBundle\Routing\CruditRouteLoader:
        tags: ['routing.loader']

    Lle\PdfGeneratorBundle\Generator\PdfGenerator:
        arguments: ["@doctrine.orm.default_entity_manager",  '@kernel','@parameter_bag', !tagged_iterator lle.pdf.generator]

    Lle\PdfGeneratorBundle\Converter\PdfToPdfArchiveConverter: ~

    Lle\PdfGeneratorBundle\Controller\:
        resource: '../../Controller'
        # admin screen: loaded by services_crudit.yaml, only when crudit-bundle is installed
        exclude: '../../Controller/Crudit/'
